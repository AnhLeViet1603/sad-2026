events {}

http {
    upstream user_service {
        server user_service:8001;
    }

    upstream staff_service {
        server staff_service:8002;
    }

    upstream product_service {
        server product_service:8003;
    }

    upstream cart_service {
        server cart_service:8004;
    }

    upstream order_service {
        server order_service:8005;
    }

    upstream payment_service {
        server payment_service:8006;
    }

    upstream shipping_service {
        server shipping_service:8007;
    }

    upstream comment_service {
        server comment_service:8008;
    }

    upstream ai_service {
        server ai_service:8009;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"success":true,"data":{"service":"nginx_api_gateway","status":"ok"}}';
        }

        location /api/users/ {
            proxy_pass http://user_service;
        }

        location /api/staff/ {
            proxy_pass http://staff_service;
        }

        location /api/products {
            proxy_pass http://product_service;
        }

        location /api/cart {
            proxy_pass http://cart_service;
        }

        location /api/orders {
            proxy_pass http://order_service;
        }

        location /api/payments {
            proxy_pass http://payment_service;
        }

        location /api/shipping {
            proxy_pass http://shipping_service;
        }

        location /api/comments {
            proxy_pass http://comment_service;
        }

        location /api/ai/ {
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://ai_service;
        }
    }
}
